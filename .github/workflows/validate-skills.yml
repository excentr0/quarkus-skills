name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned to its verified commit SHA.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # actions/setup-python v5.6.0, pinned to its verified commit SHA.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # actions/setup-java v4.7.1, pinned to its verified commit SHA.
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: fixtures/template-rendered/pom.xml
      - name: Validate skill files and seed catalog
        run: python3 scripts/validate_skills.py
      - name: Run stdlib regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check standalone skill packaging
        run: python3 scripts/validate_skills.py --standalone
      - name: Render templates and verify the Java fixture
        run: python3 scripts/run_template_fixture.py
      - name: Check whitespace in the changed range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" "$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if PARENT_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null)"; then
              git diff --check "$PARENT_SHA" "$HEAD_SHA"
            else
              git show --check --format= "$HEAD_SHA"
            fi
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi
